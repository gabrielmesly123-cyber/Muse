<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Muse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
  <header class="border-bottom">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <a href="index.html" class="h3 text-primary text-decoration-none fw-bold mb-0">Muse Music News</a>
      <a href="index.html" class="btn btn-outline-primary">Back to Home</a>
    </div>
  </header>

  <main class="container py-4 py-md-5">
    <section class="row g-0 border rounded overflow-hidden mb-5" aria-labelledby="login-heading">
      <div class="col-md-6 bg-primary text-white d-flex align-items-center justify-content-center p-5">
        <div><h1 class="display-5 fw-bold">Welcome to Muse</h1><p class="lead mb-0">Music news, all in one place.</p></div>
      </div>
      <div class="col-md-6 p-4 p-lg-5">
        <h2 class="h3 text-secondary mb-4" id="login-heading">Welcome back!</h2>
        <form>
          <div class="mb-3"><label class="visually-hidden" for="login-email">Email address</label><input class="form-control form-control-lg" type="email" id="login-email" placeholder="Email address" autocomplete="email" required></div>
          <div class="mb-3"><label class="visually-hidden" for="login-password">Password</label><input class="form-control form-control-lg" type="password" id="login-password" placeholder="Password" autocomplete="current-password" required></div>
          <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label text-secondary" for="remember">Remember password</label></div>
          <button class="btn btn-primary w-100" type="submit">SIGN IN</button>
          <p class="text-center mt-3 mb-0"><a class="link-secondary" href="register.html">Register an account</a></p>
        </form>
      </div>
    </section>

  </main>
</body>
</html>
