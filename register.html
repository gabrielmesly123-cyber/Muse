<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Muse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white min-vh-100">
  <header class="border-bottom">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <a href="index.html" class="h3 text-primary text-decoration-none fw-bold mb-0">Muse Music News</a>
      <a href="index.html" class="btn btn-outline-primary">Back to Home</a>
    </div>
  </header>
  <main class="container py-4 py-md-5">
    <section class="border rounded p-4 p-md-5" aria-labelledby="register-heading">
      <div class="d-flex flex-wrap align-items-baseline gap-2 mb-3"><h1 class="display-6 mb-0" id="register-heading">Please Sign Up</h1><span class="text-secondary fs-5">It's free and always will be.</span></div>
      <hr class="border border-primary border-2 opacity-100">
      <form class="row g-3">
        <div class="col-md-6"><label class="visually-hidden" for="first-name">First Name</label><input class="form-control form-control-lg" id="first-name" type="text" placeholder="First Name" autocomplete="given-name" required></div>
        <div class="col-md-6"><label class="visually-hidden" for="last-name">Last Name</label><input class="form-control form-control-lg" id="last-name" type="text" placeholder="Last Name" autocomplete="family-name" required></div>
        <div class="col-12"><label class="visually-hidden" for="display-name">Display Name</label><input class="form-control form-control-lg" id="display-name" type="text" placeholder="Display Name" required></div>
        <div class="col-12"><label class="visually-hidden" for="register-email">Email Address</label><input class="form-control form-control-lg" id="register-email" type="email" placeholder="Email Address" autocomplete="email" required></div>
        <div class="col-md-6"><label class="visually-hidden" for="register-password">Password</label><input class="form-control form-control-lg" id="register-password" type="password" placeholder="Password" autocomplete="new-password" required></div>
        <div class="col-md-6"><label class="visually-hidden" for="confirm-password">Confirm Password</label><input class="form-control form-control-lg" id="confirm-password" type="password" placeholder="Confirm Password" autocomplete="new-password" required></div>
        <div class="col-md-3"><div class="form-check border rounded p-3 ps-5"><input class="form-check-input" type="checkbox" id="agree" required><label class="form-check-label" for="agree">I Agree</label></div></div>
        <div class="col-md-9 d-flex align-items-center"><p class="text-secondary mb-0">By clicking Register, you agree to Muse's <a href="#">Terms and Conditions</a> and Cookie Use.</p></div>
        <div class="col-12"><hr class="border border-primary border-2 opacity-100"></div>
        <div class="col-md-6 d-grid"><button class="btn btn-info btn-lg text-white" type="submit">Register</button></div>
        <div class="col-md-6 d-grid"><a class="btn btn-success btn-lg" href="auth.html">Sign In</a></div>
      </form>
    </section>
  </main>
</body>
</html>
